    <h1>新竹美食介紹</h1>
    <p class="student-info">N13170028 蔡慶喜</p>

    <div class="container">

        <div class="card">
            <img src="gongwan.jpg" alt="新竹貢丸湯">
            <h2>新竹貢丸湯</h2>
            <p>貢丸口感彈牙，湯頭清爽，是新竹代表性小吃。</p>
            <a href="https://www.google.com/search?q=新竹貢丸湯" target="_blank">查看資訊</a>

        <div class="card">
            <img src="mifen.jpg" alt="新竹米粉">
            <h2>新竹米粉</h2>
            <p>米粉細緻，搭配肉燥與蔬菜，是在地經典料理。</p>
            <a href="https://www.google.com/search?q=新竹米粉" target="_blank">查看資訊</a>
        </div>

        <div class="card">
            <img src="yaxiangfan.jpg" alt="鴨香飯">
            <h2>鴨香飯</h2>
            <p>鴨肉香氣濃郁，搭配白飯十分下飯。</p>
            <a href="https://www.google.com/search?q=新竹鴨香飯" target="_blank">查看資訊</a>
